<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 700" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <rect width="1040" height="700" fill="#ffffff"/>
  <text x="30" y="36" font-size="22" font-weight="bold" fill="#222">키패드 조작표 (음성 안내)</text>
  <text x="30" y="62" font-size="15" fill="#555">USB 숫자 키패드 또는 키보드 윗줄의 숫자 키를 쓸 수 있습니다</text>
  <rect x="30" y="84" width="200" height="50" rx="10" fill="#f4f5f7" stroke="#d3d8de" stroke-width="1.5"/>
  <text x="130.0" y="115.0" text-anchor="middle" font-size="16" fill="#9aa4af">Num</text>
  <rect x="242" y="84" width="200" height="50" rx="10" fill="#f4f5f7" stroke="#d3d8de" stroke-width="1.5"/>
  <text x="342.0" y="115.0" text-anchor="middle" font-size="16" fill="#9aa4af">/</text>
  <rect x="454" y="84" width="200" height="50" rx="10" fill="#f4f5f7" stroke="#d3d8de" stroke-width="1.5"/>
  <text x="554.0" y="115.0" text-anchor="middle" font-size="16" fill="#9aa4af">*</text>
  <rect x="666" y="84" width="90" height="50" rx="10" fill="#f4f5f7" stroke="#d3d8de" stroke-width="1.5"/>
  <text x="711.0" y="115.0" text-anchor="middle" font-size="16" fill="#9aa4af">-</text>
  <rect x="30" y="146" width="200" height="122" rx="12" fill="#e3edf9" stroke="#3a7bd5" stroke-width="2"/>
  <text x="46" y="186" font-size="34" font-weight="bold" fill="#222">7</text>
  <text x="46" y="218" font-size="13" fill="#555">화면</text>
  <text x="102" y="218" font-size="16" font-weight="bold" fill="#222">다시 듣기</text>
  <text x="46" y="248" font-size="13" fill="#555">게임</text>
  <text x="102" y="248" font-size="16" font-weight="bold" fill="#222">시간·점수 듣기</text>
  <rect x="242" y="146" width="200" height="122" rx="12" fill="#eef2f6" stroke="#5a6b7d" stroke-width="2"/>
  <text x="258" y="186" font-size="34" font-weight="bold" fill="#222">8</text>
  <text x="258" y="218" font-size="13" fill="#555">모든 화면</text>
  <text x="258" y="248" font-size="18" font-weight="bold" fill="#222">크게</text>
  <rect x="454" y="146" width="200" height="122" rx="12" fill="#eef2f6" stroke="#5a6b7d" stroke-width="2"/>
  <text x="470" y="186" font-size="34" font-weight="bold" fill="#222">9</text>
  <text x="470" y="218" font-size="13" fill="#555">모든 화면</text>
  <text x="470" y="248" font-size="18" font-weight="bold" fill="#222">속도</text>
  <rect x="30" y="280" width="200" height="122" rx="12" fill="#e3edf9" stroke="#3a7bd5" stroke-width="2"/>
  <text x="46" y="320" font-size="34" font-weight="bold" fill="#222">4</text>
  <text x="46" y="352" font-size="13" fill="#555">화면</text>
  <text x="102" y="352" font-size="16" font-weight="bold" fill="#222">이전 버튼</text>
  <text x="46" y="382" font-size="13" fill="#555">게임</text>
  <text x="102" y="382" font-size="16" font-weight="bold" fill="#222">왼쪽으로 이동</text>
  <rect x="242" y="280" width="200" height="122" rx="12" fill="#fff4e0" stroke="#e0962a" stroke-width="2"/>
  <text x="258" y="320" font-size="34" font-weight="bold" fill="#222">5</text>
  <text x="258" y="352" font-size="13" fill="#555">화면</text>
  <text x="314" y="352" font-size="16" font-weight="bold" fill="#222">누르기</text>
  <text x="258" y="382" font-size="13" fill="#555">게임</text>
  <text x="314" y="382" font-size="16" font-weight="bold" fill="#222">일시정지</text>
  <rect x="454" y="280" width="200" height="122" rx="12" fill="#e3edf9" stroke="#3a7bd5" stroke-width="2"/>
  <text x="470" y="320" font-size="34" font-weight="bold" fill="#222">6</text>
  <text x="470" y="352" font-size="13" fill="#555">화면</text>
  <text x="526" y="352" font-size="16" font-weight="bold" fill="#222">다음 버튼</text>
  <text x="470" y="382" font-size="13" fill="#555">게임</text>
  <text x="526" y="382" font-size="16" font-weight="bold" fill="#222">오른쪽으로 이동</text>
  <rect x="30" y="414" width="200" height="122" rx="12" fill="#e3edf9" stroke="#3a7bd5" stroke-width="2"/>
  <text x="46" y="454" font-size="34" font-weight="bold" fill="#222">1</text>
  <text x="46" y="486" font-size="13" fill="#555">화면</text>
  <text x="102" y="486" font-size="16" font-weight="bold" fill="#222">뒤로</text>
  <text x="46" y="516" font-size="13" fill="#555">게임</text>
  <text x="102" y="516" font-size="16" fill="#777">동작 없음</text>
  <rect x="242" y="414" width="200" height="122" rx="12" fill="#eef2f6" stroke="#5a6b7d" stroke-width="2"/>
  <text x="258" y="454" font-size="34" font-weight="bold" fill="#222">2</text>
  <text x="258" y="486" font-size="13" fill="#555">모든 화면</text>
  <text x="258" y="516" font-size="18" font-weight="bold" fill="#222">작게</text>
  <rect x="454" y="414" width="200" height="122" rx="12" fill="#eef2f6" stroke="#5a6b7d" stroke-width="2"/>
  <text x="470" y="454" font-size="34" font-weight="bold" fill="#222">3</text>
  <text x="470" y="486" font-size="13" fill="#555">모든 화면</text>
  <text x="470" y="516" font-size="18" font-weight="bold" fill="#222">멈춤·음소거</text>
  <rect x="30" y="548" width="412" height="122" rx="12" fill="#eef2f6" stroke="#5a6b7d" stroke-width="2"/>
  <text x="46" y="588" font-size="34" font-weight="bold" fill="#222">0</text>
  <text x="46" y="620" font-size="13" fill="#555">모든 화면</text>
  <text x="46" y="650" font-size="18" font-weight="bold" fill="#222">직원 부르기</text>
  <rect x="454" y="548" width="200" height="122" rx="10" fill="#f4f5f7" stroke="#d3d8de" stroke-width="1.5"/>
  <text x="554.0" y="615.0" text-anchor="middle" font-size="16" fill="#9aa4af">.</text>
  <rect x="666" y="146" width="90" height="256" rx="10" fill="#f4f5f7" stroke="#d3d8de" stroke-width="1.5"/>
  <text x="711.0" y="280.0" text-anchor="middle" font-size="16" fill="#9aa4af">+</text>
  <rect x="666" y="414" width="90" height="256" rx="10" fill="#f4f5f7" stroke="#d3d8de" stroke-width="1.5"/>
  <text x="711.0" y="548.0" text-anchor="middle" font-size="16" fill="#9aa4af">Enter</text>
  <rect x="790" y="84" width="220" height="586" rx="12" fill="#fafbfc" stroke="#d3d8de" stroke-width="1.5"/>
  <text x="806" y="116" font-size="16" font-weight="bold" fill="#222">알아 두기</text>
  <text x="806" y="148" font-size="14" fill="#333">키패드는 없어도 됩니다.</text>
  <text x="806" y="172" font-size="14" fill="#333">모든 기능을 터치 화면으로</text>
  <text x="806" y="196" font-size="14" fill="#333">쓸 수 있고, 직원이 대신</text>
  <text x="806" y="220" font-size="14" fill="#333">눌러 드릴 수도 있습니다.</text>
  <text x="806" y="258" font-size="14" fill="#333">"5번을 눌러 주세요" 안내:</text>
  <text x="806" y="282" font-size="14" fill="#333">보정 자세마다, 게임 시작</text>
  <text x="806" y="306" font-size="14" fill="#333">전에는 5번으로만 넘어갑니다.</text>
  <text x="806" y="330" font-size="14" fill="#333">키패드가 없으면 직원이</text>
  <text x="806" y="354" font-size="14" fill="#333">노트북의 5번을 누릅니다.</text>
  <text x="806" y="392" font-size="14" fill="#333">제목 화면에서 5번을 누르면</text>
  <text x="806" y="416" font-size="14" fill="#333">음성 안내가 켜집니다.</text>
  <text x="806" y="454" font-size="14" fill="#333">0번은 직원 화면에 알림을</text>
  <text x="806" y="478" font-size="14" fill="#333">띄웁니다 (소리 없음).</text>
  <text x="806" y="516" font-size="14" fill="#333">3번은 안내를 멈추고, 재생</text>
  <text x="806" y="540" font-size="14" fill="#333">중이 아니면 음소거를</text>
  <text x="806" y="564" font-size="14" fill="#333">켜거나 끕니다.</text>
</svg>
